; Amped Fabrication — Dual VFD PoE Controller (v0.1)
;
; Why PlatformIO + Arduino, not raw ESP-IDF:
;   The locked brain is a Waveshare ESP32-S3-ETH (W5500 + PoE). Arduino-ESP32
;   already has WebServer, LittleFS, Wire, USB-CDC, and community W5500/OneWire
;   paths that get a flashable image up faster than an IDF component rewrite.
;   HAL interfaces (DAC / GPIO / temps / RS-485) stay thin so an IDF port is
;   still possible later without rewriting the app or API.
;
; Default env is native mock — builds and runs with no board attached.

[platformio]
default_envs = native
src_dir = src
include_dir = include
data_dir = data

[env]
build_src_flags =
    -Wall
    -Wextra

[env:native]
platform = native
build_flags =
    -std=c++17
    -DAMPED_MOCK=1
    -Iinclude
    -Isrc
    -I.

[env:esp32s3_poe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DAMPED_MOCK=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Iinclude
    -Isrc
    -I.
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
